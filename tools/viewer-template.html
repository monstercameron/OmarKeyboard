<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Omar Keyboard · 3D model</title>
<style>
* {box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.45 "Segoe UI",system-ui,sans-serif;color:#22312c;background:#e9ede6;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
header,footer{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px clamp(16px,4vw,48px)}
h1{font-size:clamp(21px,3vw,35px);line-height:1.1;letter-spacing:-.045em;margin:0;font-weight:650}
header small{color:#46584f;font-variant-numeric:tabular-nums}
main{position:relative;min-height:0}
model-viewer{display:block;width:100%;height:100%;min-height:180px;--poster-color:#e9ede6;--progress-bar-color:#596f61;touch-action:pan-y}
.fallback{display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
nav{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;color:inherit;padding:7px 14px;background:transparent;border:1px solid #abb7ae;border-radius:18px;cursor:pointer}
button:focus-visible{outline:2px solid #22312c;outline-offset:2px}
button:hover{background:#d9e0d7}
footer output{font-size:13px;color:#46584f}
@media(max-width:590px){header,footer{align-items:flex-start;flex-direction:column;gap:8px;padding:12px 16px}body{min-height:400px}}
</style>
</head>
<body>
<header><h1>Omar Keyboard</h1><small>Revision 3 &nbsp;·&nbsp; 422.8 × 137.1 mm</small></header>
<main>
  <model-viewer alt="Omar Keyboard with five desktop keys, two corner dials, a wide scroll roller, and a dedicated Right Alt" camera-controls touch-action="pan-y" camera-orbit="13deg 46deg 105%" min-camera-orbit="auto 0deg 8%" max-camera-orbit="auto 175deg 300%" field-of-view="32deg" shadow-intensity=".75" shadow-softness=".9" exposure="1.08" interaction-prompt="none" loading="eager"></model-viewer>
  <img class="fallback" alt="Three-quarter studio render of Omar Keyboard">
</main>
<footer><nav aria-label="Camera views">
  <button type="button" data-view="overview">Overview</button>
  <button type="button" data-view="top">Top</button>
  <button type="button" data-view="roller">Roller detail</button>
  <button type="button" data-view="rear">USB-C</button>
</nav><output aria-live="polite">Loading model…</output></footer>
<script>
const viewer=document.querySelector("model-viewer"), statusLine=document.querySelector("output");
const poster="data:image/jpeg;base64,__POSTER__";
viewer.setAttribute("poster",poster);
const fallback=()=>{
  const img=document.querySelector(".fallback");img.src=poster;img.style.display="block";viewer.style.display="none";
  document.querySelector("nav").hidden=true;document.querySelector("nav").style.display="none";
  statusLine.textContent="Studio render · Interactive rotation requires WebGL 2.";
};
viewer.addEventListener("error",fallback);
viewer.addEventListener("load",()=>{statusLine.textContent="Drag to orbit · Scroll or pinch to zoom";});
const views={
  overview:["auto auto auto","13deg 46deg 105%"],
  top:["auto auto auto","0deg 0.1deg 105%"],
  roller:["0.144m 0.034m -0.016m","12deg 48deg 31%"],
  rear:["-0.107m 0.025m -0.065m","177deg 86deg 24%"]
};
document.querySelectorAll("[data-view]").forEach(button=>button.addEventListener("click",()=>{
  const [target,orbit]=views[button.dataset.view];
  viewer.cameraTarget=target;viewer.cameraOrbit=orbit;
}));
async function unpack(id,type){
  const encoded=document.getElementById(id).textContent.trim();
  const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  const blob=new Blob([await new Response(stream).arrayBuffer()],{type});
  return URL.createObjectURL(blob);
}
async function init(){
  const [code,model]=await Promise.all([unpack("viewer-code","text/javascript"),unpack("model-data","model/gltf-binary")]);
  await import(code);await customElements.whenDefined("model-viewer");viewer.src=model;
}
window.addEventListener("DOMContentLoaded",()=>init().catch(fallback));
</script>
<script type="application/octet-stream" id="viewer-code">__CODE__</script>
<script type="application/octet-stream" id="model-data">__MODEL__</script>
<script type="text/plain" id="third-party-notices">__LICENSE__</script>
</body></html>
