name: Project checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check generated layout, repository links and model package
        run: |
          python3 tools/generate-layout.py
          git diff --exit-code
          python3 tools/check-repository.py
      - name: Compile and exercise the QMK pilot
        run: |
          mkdir -p build
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/qmk -Itests tests/pilot.c -o build/omar-pilot
          ./build/omar-pilot
      - name: Test the Omarchy helpers
        run: |
          python3 -m venv .venv
          .venv/bin/pip install lupa==2.8
          .venv/bin/python tests/check-host.py
      - name: Test the interactive prototype and offline viewer
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
